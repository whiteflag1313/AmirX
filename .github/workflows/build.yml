name: Build AmirX APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev

      - name: Install p4a and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade cython==0.29.36
          git clone https://github.com/kivy/python-for-android.git -b master p4a_src
          cd p4a_src && python -m pip install -e .

      - name: Build APK via p4a
        run: |
          # کامپایل مستقیم بدون دردسرهای بیلدوزر
          p4a create \
            --bootstrap=sdl2 \
            --requirements=python3,kivy \
            --package=org.amirx.app \
            --name="AmirX" \
            --version=1.0 \
            --sdk-dir=$HOME/.android/sdk \
            --ndk-dir=$HOME/.android/ndk \
            --orientation=portrait \
            --dest-dir=./bin

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmirX-Debug-APK
          path: bin/*.apk
