name: Build AmirX APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            openjdk-17-jdk

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade cython==0.29.36 buildozer ptuples

      - name: Force Fix Build-Tools and Run Buildozer
        run: |
          # پاک کردن کش خراب قبلی
          rm -rf ~/.buildozer/android/platform/android-sdk/build-tools/*
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmirX-Debug-APK
          path: bin/*.apk
